<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Avukat Vergi Asistanı</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1a2747"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d590"/>
      <stop offset="1" stop-color="#b8862b"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f0"/>
      <stop offset="1" stop-color="#efe8d6"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e2c27a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e2c27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="sealshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <circle cx="430" cy="70" r="260" fill="url(#glowGold)"/>
  <circle cx="60" cy="470" r="240" fill="url(#glowBlue)"/>

  <!-- makbuz -->
  <g transform="translate(128 84)" filter="url(#shadow)">
    <path d="M0 18a18 18 0 0 1 18-18h204a18 18 0 0 1 18 18v300l-20 16-20-16-20 16-20-16-20 16-20-16-20 16-20-16-20 16-20-16-20 16-20-16-20 16L0 318z" fill="url(#paper)"/>

    <!-- terazi -->
    <g transform="translate(120 64)" fill="none" stroke="#1b2a4a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <line x1="0" y1="-30" x2="0" y2="34"/>
      <line x1="-44" y1="-18" x2="44" y2="-18"/>
      <circle cx="0" cy="-34" r="5" fill="#1b2a4a" stroke="none"/>
      <line x1="-44" y1="-18" x2="-58" y2="12"/>
      <line x1="-44" y1="-18" x2="-30" y2="12"/>
      <path d="M-62 12h36a18 14 0 0 1-36 0z" fill="#1b2a4a"/>
      <line x1="44" y1="-18" x2="30" y2="12"/>
      <line x1="44" y1="-18" x2="58" y2="12"/>
      <path d="M26 12h36a18 14 0 0 1-36 0z" fill="#1b2a4a"/>
      <line x1="-22" y1="36" x2="22" y2="36"/>
    </g>

    <line x1="28" y1="124" x2="212" y2="124" stroke="#d6cdb4" stroke-width="3" stroke-dasharray="6 7" stroke-linecap="round"/>

    <rect x="28" y="146" width="82" height="11" rx="5.5" fill="#9aa6bd"/>
    <rect x="160" y="146" width="52" height="11" rx="5.5" fill="#1b2a4a"/>
    <rect x="28" y="174" width="64" height="11" rx="5.5" fill="#9aa6bd"/>
    <rect x="168" y="174" width="44" height="11" rx="5.5" fill="#1b2a4a"/>
    <rect x="28" y="202" width="92" height="11" rx="5.5" fill="#9aa6bd"/>
    <rect x="164" y="202" width="48" height="11" rx="5.5" fill="#1b2a4a"/>

    <line x1="28" y1="234" x2="212" y2="234" stroke="#d6cdb4" stroke-width="3" stroke-linecap="round"/>

    <rect x="28" y="254" width="66" height="14" rx="7" fill="#1b2a4a"/>
    <rect x="140" y="251" width="72" height="20" rx="10" fill="url(#gold)"/>
  </g>

  <!-- mühür -->
  <g transform="translate(372 378) rotate(-14)" filter="url(#sealshadow)">
    <circle r="70" fill="url(#gold)"/>
    <circle r="58" fill="none" stroke="#0b1220" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="5 5"/>
    <text x="0" y="16" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1" fill="#0b1220">%20</text>
  </g>
</svg>
