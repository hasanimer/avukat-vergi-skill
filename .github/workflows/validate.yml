name: Paket kontrolü

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hesap araçları öz-sınaması
        run: |
          python3 scripts/smm_hesap.py test
          python3 scripts/aaut_hesap.py test
      - name: Depo tutarlılık denetimi (ön bilgi, atıflar, özelge sayısı, tutarlar, README örnekleri)
        run: python3 scripts/depo_denetim.py
      - name: e-SMM arşiv denetimi (örnek veri)
        run: |
          out=$(python3 scripts/smm_hesap.py esmm-ozet examples/ornek-esmm)
          echo "$out"
          echo "$out" | grep -q "5/10 KDV tevkifatı beklenirdi"
          echo "$out" | grep -q "gerçek kişi alıcıda stopaj var"
      - name: Hatalı girdi sessizce sonuç üretmemeli
        run: |
          ! python3 scripts/aaut_hesap.py karsi-taraf --mahkeme asliye
          ! python3 scripts/aaut_hesap.py maktu yok-boyle-anahtar
          ! python3 scripts/smm_hesap.py makbuz --brut 1000 --kdv 1
